<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#006cb7">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GRT Ticket">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <title>GRT Single Ride Ticket</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ticket">
    <button class="close-btn">Close</button>

    <div class="card">
      <div class="header"><h1>Single Ride Ticket</h1></div>

      <div class="qr-section">
        <canvas id="qrCanvas" width="240" height="240"></canvas>
      </div>

      <div class="stack">
        <div class="banners">
          <div class="bars">
            <div class="bar" id="bar0"></div>
            <div class="bar" id="bar1"></div>
            <div class="bar" id="bar2"></div>
            <div id="bounceTime"></div>
          </div>
          <img class="ticket-image" src="lower_banner.png" alt="Single-ride ticket">
        </div>
      </div>
    </div>

    <div class="spacer"></div>
    <div class="divider"></div>
    <div class="footer">
      <div class="footer-btn">
        <svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        Actions
      </div>
      <div class="footer-btn">
        <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        Details
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
